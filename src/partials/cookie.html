<div class="cookie-notice" id="cookie-notice">
  <div class="cookie-notice__container">
    <div class="cookie-notice__content">
      <div class="cookie-notice__text">
        <p>Мы&nbsp;используем файлы cookie для улучшения работы сайта и&nbsp;анализа трафика.<br>
          Продолжая использовать сайт, вы&nbsp;соглашаетесь с&nbsp;нашей <a href="#">политикой использования cookie.</a></p>
      </div>
      <button class="cookie-notice__btn" type="button" id="cookie-accept">
        Хорошо
      </button>
    </div>
    <div class="cookie-notice__icon">
      <img src="./img/cookies.png" alt="Cookies" width="100" height="100">
    </div>
  </div>
</div>

<style>
.cookie-notice {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  z-index: 10000;
  background: #fff;
  border-top: 0.1rem solid #e0e0e0;
  box-shadow: 0 -0.4rem 2rem rgba(0, 0, 0, 0.1);
  transform: translateY(200%);
  transition: transform 0.3s ease-in-out;
}

.cookie-notice.show {
  transform: translateY(0);
}

.cookie-notice__container {
  max-width: 120rem;
  margin: 0 auto;
  padding: 4rem 2rem;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 2rem;
  position: relative;
}

.cookie-notice__content {
  display: flex;
  align-items: center;
  gap: 2rem;
  flex: 1;
}

.cookie-notice__text {
  flex: 1;
}

.cookie-notice__text p {
  margin: 0;
  font-size: 1.8rem;
  line-height: 1.4;
  color: #333;
}
.cookie-notice__text a {
  color: #0056b3;
  text-decoration: underline;
}
.cookie-notice__btn {
  background: #007bff;
  color: white;
  border: none;
  padding: 1.2rem 4rem;
  border-radius: 0.6rem;
  cursor: pointer;
  font-size: 1.8rem;
  font-weight: 500;
  transition: background-color 0.2s ease;
  white-space: nowrap;
  flex-shrink: 0;
}

.cookie-notice__btn:hover {
  background: #0056b3;
}

.cookie-notice__icon {
  position: absolute;
  top: 0rem;
  transform: translateY(-50%);
  right: -5rem;
  width: 8rem;
  height: 8rem;
  flex-shrink: 0;
}

.cookie-notice__icon img {
  width: 100%;
  height: 100%;
  object-fit: contain;
}

/* Адаптивность */
@media (max-width: 76.8rem) {
  .cookie-notice__container {
    flex-direction: column;
    align-items: flex-start;
    gap: 1.5rem;
  }

  .cookie-notice__content {
    flex-direction: column;
    align-items: flex-start;
    gap: 1.5rem;
    width: 100%;
  }

  .cookie-notice__btn {
    width: 100%;
    text-align: center;
  }

  .cookie-notice__icon {
    width: 12rem;
    height: 12rem;
  }

  .cookie-notice__text p {
    font-size: 2.2rem;
  }

  .cookie-notice__btn {
    padding: 1.2rem 2rem;
    font-size: 2rem;
  }
}
@media (max-width: 76.8rem){

  .cookie-notice__icon {
    width: 8rem;
    height: 8rem;
    right: 2rem;
  }
}

</style>

<script>
(function() {
  'use strict';

  // Проверяем, согласился ли пользователь с куки
  function hasCookieConsent() {
    return localStorage.getItem('cookie-consent') === 'accepted';
  }

  // Сохраняем согласие пользователя
  function setCookieConsent() {
    localStorage.setItem('cookie-consent', 'accepted');
  }

  // Показываем плашку о куки
  function showCookieNotice() {
    const notice = document.getElementById('cookie-notice');
    if (notice) {
      notice.classList.add('show');
    }
  }

  // Скрываем плашку о куки
  function hideCookieNotice() {
    const notice = document.getElementById('cookie-notice');
    if (notice) {
      notice.classList.remove('show');
      // Удаляем элемент из DOM через некоторое время после анимации
      setTimeout(() => {
        if (notice.parentNode) {
          notice.parentNode.removeChild(notice);
        }
      }, 300);
    }
  }

  // Обработчик клика по кнопке "Хорошо"
  function handleCookieAccept() {
    setCookieConsent();
    hideCookieNotice();
  }

  // Инициализация
  function init() {
    // Если пользователь уже согласился, не показываем плашку
    if (hasCookieConsent()) {
      return;
    }

    // Показываем плашку через небольшую задержку для плавности
    setTimeout(showCookieNotice, 500);

    // Добавляем обработчик клика
    const acceptBtn = document.getElementById('cookie-accept');
    if (acceptBtn) {
      acceptBtn.addEventListener('click', handleCookieAccept);
    }
  }

  // Запускаем инициализацию когда DOM готов
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})();
</script>
